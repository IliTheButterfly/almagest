# pnpm blocks dependency postinstall scripts by default, and since pnpm 10 an
# ignored build is a hard error rather than a warning — so CI fails without
# this. esbuild's script fetches its platform binary; vite and vitest cannot
# start without it.
#
# Two gotchas, both of which cost a CI round-trip: the key is `allowBuilds`
# (pnpm 11 renamed it from `onlyBuiltDependencies`), and it is a **map**, not a
# list. A list is silently parsed as {'0': 'esbuild'} and does nothing.
allowBuilds:
  esbuild: true
  # Denied, not allowed: `tesseract.js`'s only install script is
  # `opencollective-postinstall || true`, a donation banner. The wasm core and
  # worker it actually needs at runtime are plain files in the package, copied
  # out by the `almagest-ocr-runtime` plugin in `vite.config.ts` — nothing about
  # OCR depends on this script running.
  tesseract.js: false

# nginx in front of the PWA and the API, as one origin.
#
# One origin is not a convenience here, it is a requirement in three separate
# ways, and each of them breaks silently rather than loudly if it is violated:
#
#   1. `frontend/src/lib/api/client.ts` builds its client with
#      `baseUrl: currentOrigin()`. There is no configurable API host and there
#      should not be one.
#   2. `/s/{short_id}` is handled by the *backend*, which answers 302 with a
#      **relative** path (`/scan?unknown=...`, `/provision?code=...`, a part
#      page). The browser resolves that against whatever origin served the
#      redirect, so the PWA has to be on that same origin or a tag tap lands
#      nowhere.
#   3. `getUserMedia` and `NDEFReader` are gated behind a secure context. TLS
#      terminates here; over plain http the camera and Web NFC do not merely
#      fail, they are *absent*, and every scanning affordance quietly vanishes.
#
# ADR 0001 settled the origin as https://almagest.lan, served by a private CA.

# Probe/redirect listener. Kubernetes probes hit /healthz here rather than over
# TLS, so a certificate the kubelet does not trust cannot make the pod look dead.
server {
    listen 8080 default_server;
    server_name _;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Anything else on the cleartext port is a mistake worth correcting loudly
    # in the address bar rather than serving.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 8443 ssl;
    http2 on;
    server_name almagest.lan;

    # Mounted from secret/almagest-tls, which is built out of the gitignored
    # certs/ directory by `make k8s-tls`. The key never enters the image or
    # the repository.
    ssl_certificate     /etc/almagest/tls/tls.crt;
    ssl_certificate_key /etc/almagest/tls/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:4m;
    ssl_session_timeout 1h;

    root /usr/share/nginx/html;
    index index.html;

    # Datasheet PDFs and container photos are uploaded through here. nginx's
    # 1 MB default would reject a perfectly ordinary datasheet with a 413 that
    # the upload UI can only report as a generic failure.
    client_max_body_size 128m;

    # Enrichment and extraction requests are slow by nature; the default 60 s
    # read timeout turns a working long request into a 504.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    # The device agent's loopback WebSocket and any future live updates need the
    # upgrade to survive the hop.
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    location /api/ {
        proxy_pass http://almagest-api:8000;
    }

    # FastAPI's own docs, handy on a self-hosted box and harmless.
    location = /openapi.json { proxy_pass http://almagest-api:8000; }
    location = /docs         { proxy_pass http://almagest-api:8000; }
    location = /redoc        { proxy_pass http://almagest-api:8000; }

    # The tag-tap path. A regex rather than the prefix `/s`, for exactly the
    # reason vite.config.ts documents: a plain `/s` prefix also swallows
    # `/src/...` and every other asset path beginning with those two
    # characters. This location cannot be renamed — it is physically written
    # into every NFC tag and printed QR code that has ever been provisioned.
    location ~ ^/s/[A-Za-z0-9-]+$ {
        proxy_pass http://almagest-api:8000;
    }

    # Vite emits content-hashed filenames under /assets, so they are immutable.
    # One header, not two: `expires` emits its own Cache-Control, so pairing it
    # with add_header sends the field twice.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback last: any path that is not a real file is a client route.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

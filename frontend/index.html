<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Kept in step with the resolved `--bg` by lib/theme.ts once the app boots. -->
    <meta name="theme-color" content="#ecf9ff" />
    <title>Almagest</title>
    <!--
      One SVG covers every desktop size, and it carries its own
      prefers-color-scheme rule so the tab icon follows the OS rather than
      staying dark-on-dark.

      iOS still will not take an SVG for a home-screen icon, and this app is
      meant to be added to a home screen — that is the whole point of the
      scan-a-tag flow — so the PNG is not redundant. Regenerate it from the SVG
      with:
        rsvg-convert -w 180 -h 180 public/apple-touch-icon.svg -o public/apple-touch-icon.png
      There is no manifest yet, so no maskable or 192/512 icons are declared;
      add them when one lands rather than shipping files nothing references.
    -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      /*
       * Apply a stored theme override before first paint.
       *
       * This has to be inline and blocking: a module runs after the first frame,
       * so doing it in `theme.ts` alone would flash the OS theme on every load.
       * The storage key is duplicated from `src/lib/theme.ts` (THEME_STORAGE_KEY)
       * and a test asserts the two agree.
       */
      try {
        var stored = localStorage.getItem("almagest.theme");
        if (stored === "light" || stored === "dark") {
          document.documentElement.setAttribute("data-theme", stored);
        }
      } catch (error) {
        /* Storage disabled — the OS preference still applies. */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

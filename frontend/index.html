<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Kept in step with the resolved `--bg` by lib/theme.ts once the app boots. -->
    <meta name="theme-color" content="#ecf9ff" />
    <title>Almagest</title>
    <script>
      /*
       * Apply a stored theme override before first paint.
       *
       * This has to be inline and blocking: a module runs after the first frame,
       * so doing it in `theme.ts` alone would flash the OS theme on every load.
       * The storage key is duplicated from `src/lib/theme.ts` (THEME_STORAGE_KEY)
       * and a test asserts the two agree.
       */
      try {
        var stored = localStorage.getItem("almagest.theme");
        if (stored === "light" || stored === "dark") {
          document.documentElement.setAttribute("data-theme", stored);
        }
      } catch (error) {
        /* Storage disabled — the OS preference still applies. */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # First, and its own job, because it is the one component whose defining
  # property is what it does *not* install. `tests/test_stdlib_only.py` would
  # still fail in a venv that also holds the backend — it diffs `sys.modules`
  # against `sys.stdlib_module_names` rather than asking whether sqlalchemy is
  # importable — but a venv holding nothing else is the environment the assertion
  # is actually *about*: it is what the Pi has, and a failure here is then a
  # `ModuleNotFoundError` naming the offending import rather than a diff to read.
  # It installs in seconds either way.
  idcodec:
    name: idcodec
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: idcodec
    steps:
      # No `submodules: recursive`: this package depends on nothing, which is the
      # point of it. If this checkout ever needs them, something has been added
      # that should not have been.
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: idcodec/uv.lock

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy idcodec

      - name: pytest
        run: uv run pytest -q

  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy app

      - name: pytest
        run: uv run pytest -q

      # Catches a model edited without a matching migration. `create_all` in the
      # tests would hide this; only a real upgrade followed by an autogenerate
      # comparison surfaces it.
      - name: migrations match models
        run: |
          uv run alembic upgrade head
          uv run alembic check

      # The frontend and deviceagent clients are generated from this document,
      # so a stale committed copy means a stale generated client.
      - name: openapi.json is current
        run: |
          uv run python -m app.scripts.export_openapi ../openapi.json
          git diff --exit-code ../openapi.json

  # A separate job rather than another step in `backend`, even though `make check`
  # folds `agent-check` in locally: it is a second venv with its own lock file, so
  # it caches and runs in parallel, and a red X here names the component that
  # broke instead of a "backend" failure that is really a Pi-side one.
  deviceagent:
    name: deviceagent
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deviceagent
    steps:
      # `submodules: recursive` because `almagest-backend` is still a *dev*
      # dependency here — `tests/test_session_ledger.py` runs the real migrations
      # — and the backend depends on the two submodule libraries. Without them
      # `uv sync --dev` fails at resolution. The agent's runtime dependencies
      # (`almagest-idcodec`, websockets, pydantic-settings) need none of this,
      # which is what the Pi installs.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: deviceagent/uv.lock

      # No `--all-extras`: the `pi` extra is the CircuitPython stack, and there is
      # no PN532 on a GitHub runner to talk to. It stays in the lock file so a
      # broken pin is still caught by `uv lock --check`-style drift, but building
      # it here would compile sysv-ipc for nothing.
      - name: Install dependencies
        run: uv sync --locked --dev

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy agent

      # The `live` tests need a real reader and are skipped by a conftest hook,
      # which is deliberate: they stay visible in the summary as an unexercised
      # contract rather than silently vanishing from collection.
      - name: pytest
        run: uv run pytest -q

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # `uses:` steps ignore defaults.run.working-directory, so the action has
      # to be pointed at the frontend's package.json explicitly. The pnpm
      # version comes from its `packageManager` field, which also pins it for
      # corepack locally — so CI and a laptop cannot drift.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: eslint
        run: pnpm lint

      - name: tsc
        run: pnpm typecheck

      - name: vitest
        run: pnpm test

      - name: build
        run: pnpm build

      # Closes the contract loop. The backend job checks openapi.json is fresh
      # against the routes; this checks the generated TypeScript is fresh
      # against openapi.json. Together they make it impossible to change a
      # route signature without the client following.
      - name: generated API types are current
        run: |
          pnpm generate:api
          git diff --exit-code src/lib/api/schema.ts

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v3

      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          load: true
          tags: almagest-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A container that cannot apply its own migrations is not deployable.
      - name: Migrations apply inside the image
        run: |
          docker run --rm \
            -e ALMAGEST_DB_PATH=/tmp/ci.db \
            almagest-api:ci alembic upgrade head

      # The other half of what release.yml publishes. Built here without
      # pushing, so a broken nginx config or a frontend that no longer compiles
      # fails on the pull request rather than at deploy time.
      - name: Build the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          load: true
          tags: almagest-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # `nginx -t` parses the config for real, including the regex location that
      # carries the tag-tap path. It needs two things the image deliberately
      # does not contain, both supplied here rather than weakened in the config:
      #
      #   * the TLS keypair, which lives in a Secret at runtime and must never
      #     be baked into an image — a throwaway one proves the paths are right;
      #   * a resolvable `almagest-api`, because nginx resolves a literal
      #     proxy_pass hostname at startup and `-t` is no exception.
      - name: nginx config is valid
        run: |
          mkdir -p /tmp/tls
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -subj /CN=almagest.lan \
            -keyout /tmp/tls/tls.key -out /tmp/tls/tls.crt 2>/dev/null
          # openssl writes the key 0600 owned by the runner's uid, and the
          # image runs as uid 101, so without this nginx fails to open it. In
          # the cluster this does not arise: a Secret volume mounts 0644.
          chmod a+r /tmp/tls/tls.key
          docker run --rm \
            -v /tmp/tls:/etc/almagest/tls:ro \
            --add-host almagest-api:127.0.0.1 \
            almagest-web:ci nginx -t

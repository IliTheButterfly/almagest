[project]
name = "almagest-backend"
version = "0.1.0"
description = "Almagest — self-hosted electronic-component inventory. API and data model."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pint>=0.24",
]

[project.optional-dependencies]
# Kept out of the default install so the API image stays small. Phase 4+.
labels = [
    "reportlab>=4.2",
    "segno>=1.6",
    "pillow>=11.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    # starlette>=1.3 deprecates httpx in TestClient in favour of httpx2.
    "httpx2>=2.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "ARG",  # unused arguments
    "PTH",  # use pathlib
    "RUF",
]
ignore = [
    "B008",    # FastAPI's Depends() in defaults is the documented idiom
    "RUF012",  # ClassVar annotations on mutable class attrs — noisy with SQLAlchemy
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG001", "ARG002"]  # pytest fixtures are injected, not called

[tool.ruff.lint.isort]
known-first-party = ["app"]
# The `alembic/` migration directory sits next to `app/`, which otherwise makes
# ruff classify the installed `alembic` package as first-party.
known-third-party = ["alembic"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["app"]
strict = true
plugins = ["pydantic.mypy"]
# Alembic's generated migration scripts are not worth annotating.
exclude = ["^alembic/versions/"]

[[tool.mypy.overrides]]
module = ["pint.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "live: hits a real network provider; skipped unless -m live is passed",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["app"]
omit = ["alembic/*"]

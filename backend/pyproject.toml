[project]
name = "almagest-backend"
version = "0.1.0"
description = "Almagest — self-hosted electronic-component inventory. API and data model."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pint>=0.24",
    "elec-value-parser>=0.1",
    "ecia-barcode>=0.1",
    # The short-ID codec and the tag payload rules, standard library only.
    # `app.services.shortid` and `app.services.provisioning` re-export it, so
    # nothing in `app` imports it twice. It is a separate distribution because
    # `deviceagent` needs the identical rules on a Raspberry Pi and used to get
    # them by depending on *this* package — see `idcodec/README.md`.
    "almagest-idcodec",
]

# The publishable libraries are submodules, consumed from the checkout rather
# than from PyPI until they are actually released there. Switching to published
# wheels later means deleting the matching entry here and tightening the
# constraint above — nothing else.
#
# Note the constraint is deliberately loose. While a path source is in force uv
# resolves to whatever the checkout declares, so a tighter pin here would read
# as a guarantee it is not currently enforcing.
[tool.uv.sources]
elec-value-parser = { path = "../elec-value-parser", editable = true }
ecia-barcode = { path = "../ecia-barcode", editable = true }
# In-repo, not a submodule and not aimed at strangers, so there is no "publish
# it later" story to keep the constraint loose for.
almagest-idcodec = { path = "../idcodec", editable = true }

[project.optional-dependencies]
# Kept out of the default install so the API image stays small. Phase 4+.
labels = [
    "reportlab>=4.2",
    "segno>=1.6",
    "pillow>=11.0",
]

# Datasheet **extraction**, which per docs/adr/0005-extraction-runs-outside-the-api.md
# is a separate process with its own image. The API stores blobs, serves them and
# queries the text index; it never opens a PDF, so it must never install this.
#
# That split is the whole reason the extra exists. The API image is rebuilt in CI
# on every push and the deployment is a single replica on a small RWO volume, so a
# route that streams a PDF cannot be allowed to drag a parser — let alone Docling's
# torch and transformers, which are 2-5 GB and are why the pipeline moved out of
# the API in the first place. **Nothing in this group may ever grow a model
# runtime**; a heavier extractor belongs in the worker image's own requirements,
# not here, and the `Extractor` Protocol exists so it can be added without the
# default install noticing.
#
# CI installs it (`uv sync --all-extras`), so a test may import from it — but a
# test that does is testing extraction, not the store. `tests/integration/
# test_documents.py` deliberately builds its PDF fixtures by hand instead.
datasheets = [
    "pypdf>=5.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    # starlette>=1.3 deprecates httpx in TestClient in favour of httpx2.
    "httpx2>=2.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "ARG",  # unused arguments
    "PTH",  # use pathlib
    "RUF",
]
ignore = [
    "B008",    # FastAPI's Depends() in defaults is the documented idiom
    "RUF012",  # ClassVar annotations on mutable class attrs — noisy with SQLAlchemy
    # RUF002 flags visually-confusable characters in docstrings. Its real value
    # is catching homoglyphs in *identifiers*; in prose it only ever objects to
    # deliberate typography (en dashes, minus signs, µ, Ω), all of which this
    # codebase uses on purpose. RUF001 and RUF003 stay on.
    "RUF002",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG001", "ARG002"]  # pytest fixtures are injected, not called
# Signatures fixed by the frameworks: SQLAlchemy always passes `dialect` to a
# TypeDecorator hook, and Alembic always passes `autogen_context` to
# `render_item`. Neither may be renamed or dropped, and neither is always used.
"app/models/types.py" = ["ARG002"]
"alembic/env.py" = ["ARG001"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
# The `alembic/` migration directory sits next to `app/`, which otherwise makes
# ruff classify the installed `alembic` package as first-party.
known-third-party = ["alembic"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["app"]
strict = true
plugins = ["pydantic.mypy"]
# Alembic's generated migration scripts are not worth annotating.
exclude = ["^alembic/versions/"]

[[tool.mypy.overrides]]
module = ["pint.*"]
ignore_missing_imports = true

# reportlab and segno ship no type stubs (segno's own annotations satisfy
# mypy already; reportlab's do not). Both are optional ("labels") deps, so
# this is narrower than a blanket `ignore_missing_imports` on the project.
[[tool.mypy.overrides]]
module = ["reportlab.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "live: hits a real network provider; skipped unless -m live is passed",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["app"]
omit = ["alembic/*"]

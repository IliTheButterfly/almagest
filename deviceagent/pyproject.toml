[project]
name = "almagest-deviceagent"
version = "0.1.0"
description = "Almagest — the Pi-side device agent: the NFC tag reader and the station event stream."
readme = "README.md"
requires-python = ">=3.12,<3.13"

# Deliberately tiny. This process runs on a Raspberry Pi 4 next to kiosk
# Chromium, and every dependency here is one more thing to cross-compile or
# apt-pin on a machine nobody wants to debug at a bench.
dependencies = [
    "websockets>=14",
    "pydantic-settings>=2.6",
    # `parse_ndef_url`, `normalize_tag_uid`, and the short-ID codec the first of
    # those verifies its check symbol with.
    #
    # WHY a dependency rather than a copy: a UID normalised by a different rule
    # is invisible to the `location_tags` binding it should match *while looking
    # perfectly correct in both places*. Bind time and resolve time must agree
    # or a provisioning walk silently reports a whole cabinet as swapped, and
    # the only way to guarantee agreement is one implementation.
    #
    # This used to be `almagest-backend`, which was the same guarantee at the
    # price of fastapi, sqlalchemy, alembic and pint — ~25 wheels the agent
    # never imports — on a Pi 4 running kiosk Chromium. `almagest-idcodec`
    # declares no dependencies at all and `idcodec/tests/test_stdlib_only.py`
    # keeps it that way, so the guarantee now costs nothing. The API reaches the
    # same two through `app.services.provisioning`, which re-exports
    # `parse_ndef_url` verbatim and wraps `normalize_tag_uid` only to translate
    # its `InvalidTagUid` into the `ProvisioningError` its routes answer with, so
    # the rule being applied is this same one.
    "almagest-idcodec",
]

[project.optional-dependencies]
# Installed only on the Pi. `Pn532TagSource` imports these inside its
# constructor precisely so that a dev machine — which has no reader to talk to —
# can run the whole agent against `FakeTagSource` without them present.
pi = [
    "adafruit-circuitpython-pn532>=2.4",
    "pyserial>=3.5",
]

# Talking to a Flipper Zero (ADR 0013). **Not installed on the Pi**: the station
# has a PN532 under its platform and no reason to carry a Bluetooth stack. This
# is for the other deployment the bridge now has — a laptop, where the Flipper is
# the only reader in the building and Web NFC does not exist.
#
# `bleak` is the heavier half and is only needed for the BLE transport; USB works
# with `pyserial` alone. They are one extra rather than two because a user who
# has a Flipper has both transports available to them, and splitting it would
# make "why can it not see my Flipper" have two answers instead of one.
flipper = [
    "pyserial>=3.5",
    "bleak>=0.22",
]

[project.scripts]
almagest-deviceagent = "agent.main:main"

# NOTE: **a path dependency's `pyproject.toml` is part of this lockfile's
# input.** Editing `idcodec/pyproject.toml` — or `backend/pyproject.toml`, which
# is still a path dependency of the `dev` group below — invalidates the lock, and
# adding an optional-dependency group is enough to do it. CI runs
# `uv sync --locked` and fails in seconds; a local `make check` syncs *without*
# `--locked`, relocks silently, and passes. So a stale lock is invisible until
# the PR goes red: after touching either of those files, run `uv lock` here and
# commit the result.
#
# The exposure is much smaller than it was. Phase 4's `datasheets` extra surfaced
# this precisely because the *backend* was the runtime dependency, so every API
# dependency change reached here; `almagest-idcodec` declares nothing and changes
# almost never.
[tool.uv.sources]
almagest-idcodec = { path = "../idcodec", editable = true }
almagest-backend = { path = "../backend", editable = true }

[dependency-groups]
# `almagest-backend` is a **test-only** dependency, and it is the one thing that
# keeps sqlalchemy in the *development* venv. `tests/test_session_ledger.py`
# asserts what the station actually writes to the ledger against real Alembic
# migrations and real rows — nothing weaker proves that aborting a session writes
# nothing — and that needs the models and the routes, not a mock of them.
#
# It stays out of `[project.dependencies]` so it stays off the Pi: `uv sync
# --extra pi --no-dev` there installs websockets, pydantic-settings, idcodec and
# the CircuitPython stack, and no web framework. Verify with `uv pip list`, not
# by reading this comment.
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "almagest-backend",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The whole directory, so `agent/fixtures/*.json` ships with the package — the
# `--fake` script and the test fixture are the same file on purpose.
packages = ["agent"]

# ---------------------------------------------------------------------------
# ruff — same settings as backend/pyproject.toml. Two Python components in one
# repo formatted by two rulesets is a diff-noise generator.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "ARG",  # unused arguments
    "PTH",  # use pathlib
    "RUF",
]
ignore = [
    # See backend/pyproject.toml: RUF002 only ever objects to deliberate
    # typography (en dashes, µ, Ω) in prose. RUF001 and RUF003 stay on.
    "RUF002",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG001", "ARG002"]  # pytest fixtures are injected, not called

[tool.ruff.lint.isort]
known-first-party = ["agent"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["agent"]
strict = true

# None of the CircuitPython stack ships stubs, and on a dev machine it is not
# even installed — `ignore_missing_imports` covers both. It is scoped to these
# modules rather than global so that a typo in a first-party import is still an
# error.
[[tool.mypy.overrides]]
module = ["adafruit_pn532.*", "board", "busio", "serial.*", "bleak.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "live: needs the real PN532 wired to this machine; skipped unless -m live is passed",
]
filterwarnings = ["error"]

# Local/desktop deployment. The Kubernetes manifests under deploy/ are the
# cluster target and are generated separately — this file is not their source.
#
#   docker compose up -d --build
#   docker compose exec api alembic upgrade head
#   docker compose exec api python -m app.scripts.seed_demo

services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: almagest-api:dev
    container_name: almagest-api
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      # Absolute, so they are unaffected by the repo-root anchoring that
      # app.config applies to relative paths during development.
      ALMAGEST_DB_PATH: /data/almagest.db
      ALMAGEST_DATASHEET_DIR: /data/datasheets
    volumes:
      # SQLite must live on a local volume, never network storage.
      # The image runs as uid 10001; if the bind mount gives permission errors
      # on your host, add a compose override setting `user: "$(id -u):$(id -g)"`.
      - ./data:/data
    restart: unless-stopped

# Exactly one API replica, always. `local-shared` in the cluster is
# ReadWriteOnce and SQLite tolerates exactly one writer — two writers is
# corruption, and a rolling update deadlocks on volume attach.

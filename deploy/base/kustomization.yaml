apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# `ili` is shared with unrelated production workloads (an octans runner, a
# KubeVirt builder VM). This cluster cannot give Almagest a namespace of its
# own — namespaces are cluster-scoped and the service account cannot create
# them, and there is no Hierarchical Namespace Controller — so the separation
# is by name and by label instead. Every resource here is prefixed `almagest-`,
# and the label below makes
#
#     kubectl get all -l app.kubernetes.io/part-of=almagest
#
# behave like a namespace filter. Never `kubectl delete` here with a bare
# selector, `--all`, or a namespace scope, and never `kubectl apply --prune`:
# all three would reach the co-tenant workloads.
namespace: ili

resources:
  - config.yaml
  - pvc.yaml
  - api.yaml
  # The API's own identity, so it can start a model server on demand without
  # that permission landing on every pod in a shared namespace.
  - api-rbac.yaml
  - web.yaml
  - backup.yaml
  - maintenance.yaml
  - blob-scrub.yaml
  # The local model server (ADR 0016). Holds the node's only GPU; see the
  # header in llm.yaml for how it is yielded to the co-tenant.
  - llm.yaml
  # The big model, off by default. The GPU is exclusive, so at most one of
  # llm.yaml and this may be scaled up at a time — see llm-vllm.yaml's header.
  - llm-vllm.yaml
  # Gives the GPU back on idle, so nothing depends on somebody remembering.
  - llm-reaper.yaml

labels:
  - pairs:
      app.kubernetes.io/name: almagest
      app.kubernetes.io/part-of: almagest
    # Applied to resource metadata and pod templates, but NOT merged into
    # Deployment selectors. A selector is immutable after creation, so folding
    # generated labels into one turns any future label change into "delete the
    # Deployment and recreate it". The Deployments declare their own selectors
    # explicitly for the same reason.
    includeSelectors: false
    includeTemplates: true
